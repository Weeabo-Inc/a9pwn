[package]
name = "a9pwn"
version = "0.1.0"
edition = "2021"
description = "gaster's checkm8 rewritten in Rust, with instrumentation as a first-class feature"
license = "Apache-2.0"
# Blob provenance: payloads/*.bin are vendored from 0x7ff/gaster (Apache-2.0).
# See payloads/README.md.

[dependencies]
rusb = "0.9"
libusb1-sys = "0.7"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = true          # keep symbols: a hang on real hardware needs a usable stack
opt-level = 2
